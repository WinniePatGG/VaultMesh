name: VaultMesh
description: $description
version: '${version}'

main: de.winniepat.vaultMesh.VaultMesh
api-version: '1.13'
load: POSTWORLD

authors: [WinniePatGG]
website: https://winniepat.de

commands:
  vaultmesh:
    description: Manage VaultMesh storage networks.
    usage: /vaultmesh <create|link|unlink|open|upgrade|giveupgrade|members|access|list|delete|cancel>
    aliases: [vm]

permissions:
  vaultmesh.use:
    description: Open and use shared storage networks.
    default: true

  vaultmesh.create:
    description: Create your own storage networks.
    default: true

  vaultmesh.manage:
    description: Manage any storage network and bypass access checks.
    default: op